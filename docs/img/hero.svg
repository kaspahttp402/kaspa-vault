<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-label="KaspaVault: steal the keys, not the money">
<style>
  .t{font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .blk{fill:#70C7BA;opacity:0;animation:pop 6s infinite}
  .lnk{stroke:#70C7BA;stroke-width:1.2;opacity:0;animation:pop 6s infinite}
  @keyframes pop{0%{opacity:0}8%{opacity:.35}70%{opacity:.35}85%{opacity:0}100%{opacity:0}}
  .ring{fill:none;stroke-width:2;transform-origin:760px 170px}
  .r1{stroke:#49EACB;stroke-dasharray:6 10;animation:spin 18s linear infinite}
  .r2{stroke:#70C7BA;stroke-dasharray:2 8;animation:spin 26s linear infinite reverse}
  .r3{stroke:#f5b942;stroke-dasharray:40 30;opacity:.7;animation:spin 40s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .core{transform-origin:760px 170px;animation:breathe 3s ease-in-out infinite}
  @keyframes breathe{50%{transform:scale(1.06)}}
  .glow{animation:glow 3s ease-in-out infinite}
  @keyframes glow{50%{opacity:.9}}
  .bad{animation:bounce 4s ease-in infinite;transform-origin:center}
  @keyframes bounce{0%{transform:translate(0,0);opacity:0}10%{opacity:1}45%{transform:translate(42px,0);opacity:1}55%{transform:translate(18px,0);opacity:1}75%{transform:translate(-20px,0);opacity:0}100%{opacity:0}}
  .tag{font-size:13px;fill:#0b1416;font-weight:700}
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071012"/><stop offset="1" stop-color="#0f2226"/></linearGradient>
  <radialGradient id="halo"><stop offset="0" stop-color="#49EACB" stop-opacity=".55"/><stop offset="1" stop-color="#49EACB" stop-opacity="0"/></radialGradient>
</defs>
<rect width="960" height="340" rx="22" fill="url(#bg)"/>
<!-- drifting blockDAG in the background -->
<g>
  <rect class="blk" x="40"  y="250" width="22" height="22" rx="4" style="animation-delay:-3s"/>
  <rect class="blk" x="40"  y="290" width="22" height="22" rx="4" style="animation-delay:-2.8s"/>
  <rect class="blk" x="95"  y="236" width="22" height="22" rx="4" style="animation-delay:-2.5s"/>
  <rect class="blk" x="95"  y="272" width="22" height="22" rx="4" style="animation-delay:-2.4s"/>
  <rect class="blk" x="95"  y="306" width="22" height="22" rx="4" style="animation-delay:-2.3s"/>
  <rect class="blk" x="150" y="256" width="22" height="22" rx="4" style="animation-delay:-2s"/>
  <rect class="blk" x="150" y="296" width="22" height="22" rx="4" style="animation-delay:-1.9s"/>
  <rect class="blk" x="205" y="240" width="22" height="22" rx="4" style="animation-delay:-1.6s"/>
  <rect class="blk" x="205" y="280" width="22" height="22" rx="4" style="animation-delay:-1.5s"/>
  <rect class="blk" x="260" y="262" width="22" height="22" rx="4" style="animation-delay:-1.2s"/>
  <rect class="blk" x="260" y="300" width="22" height="22" rx="4" style="animation-delay:-1.1s"/>
  <rect class="blk" x="315" y="248" width="22" height="22" rx="4" style="animation-delay:-0.8s"/>
  <rect class="blk" x="315" y="286" width="22" height="22" rx="4" style="animation-delay:-0.7s"/>
  <path class="lnk" d="M62 261L95 247M62 261L95 283M62 301L95 283M62 301L95 317" style="animation-delay:-2.5s"/>
  <path class="lnk" d="M117 247L150 267M117 283L150 267M117 283L150 307M117 317L150 307" style="animation-delay:-2s"/>
  <path class="lnk" d="M172 267L205 251M172 267L205 291M172 307L205 291" style="animation-delay:-1.6s"/>
  <path class="lnk" d="M227 251L260 273M227 291L260 273M227 291L260 311" style="animation-delay:-1.2s"/>
  <path class="lnk" d="M282 273L315 259M282 311L315 297M282 273L315 297" style="animation-delay:-0.8s"/>
</g>
<text class="t" x="44" y="78" font-size="50" font-weight="800" fill="#e6f4f1">Kaspa<tspan fill="#49EACB">Vault</tspan></text>
<text class="t" x="46" y="124" font-size="26" font-weight="700" fill="#e6f4f1">Steal the keys. <tspan fill="#49EACB">Not the money.</tspan></text>
<text class="t" x="46" y="160" font-size="16" fill="#9fb8b4">A self-custody Kaspa account whose spending rules are</text>
<text class="t" x="46" y="182" font-size="16" fill="#9fb8b4">enforced by the network itself: daily limit, notice period,</text>
<text class="t" x="46" y="204" font-size="16" fill="#9fb8b4">emergency stop to a paper vault, and an heir.</text>
<!-- the coin wrapped in rule rings -->
<circle cx="760" cy="170" r="150" fill="url(#halo)" class="glow" opacity=".5"/>
<circle class="ring r3" cx="760" cy="170" r="128"/>
<circle class="ring r2" cx="760" cy="170" r="108"/>
<circle class="ring r1" cx="760" cy="170" r="88"/>
<g class="core">
  <circle cx="760" cy="170" r="62" fill="#0b1416" stroke="#49EACB" stroke-width="3"/>
  <text class="t" x="760" y="192" font-size="64" font-weight="800" fill="#49EACB" text-anchor="middle">K</text>
</g>
<g class="t" font-size="12" font-weight="700">
  <rect x="842" y="52"  width="96" height="22" rx="11" fill="#49EACB"/><text class="tag" x="890" y="67" text-anchor="middle">DAILY LIMIT</text>
  <rect x="842" y="268" width="96" height="22" rx="11" fill="#70C7BA"/><text class="tag" x="890" y="283" text-anchor="middle">NOTICE</text>
  <rect x="582" y="52"  width="96" height="22" rx="11" fill="#f5b942"/><text class="tag" x="630" y="67" text-anchor="middle">STOP → VAULT</text>
  <rect x="582" y="268" width="96" height="22" rx="11" fill="#c9a7ff"/><text class="tag" x="630" y="283" text-anchor="middle">HEIR</text>
</g>
<!-- a thief arrow that bounces off the rules -->
<g class="bad"><path d="M520 170h52" stroke="#ff6b5b" stroke-width="4" stroke-linecap="round"/><path d="M572 160L586 170L572 180Z" fill="#ff6b5b"/></g>
</svg>
