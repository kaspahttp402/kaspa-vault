<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Desktop demo: index.html plus demo.js (the Sample account), loaded before data.js. The phone never opens this page
     (build.sh leaves demo.html and demo.js out of the app). Same policy as index.html: nothing loads from the network,
     so Sample's prices are demo.js's seeded walk. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#06070c">
<title>KaspaVault Sample</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="notabs">
<canvas id="scene" aria-hidden="true"></canvas>
<main id="stage"></main>
<nav id="tabs" aria-label="Main">
  <button data-tab="home">Home</button>
  <button data-tab="send">Send</button>
  <button data-tab="receive">Receive</button>
  <button data-tab="price">Price</button>
  <button data-tab="people">People</button>
  <button data-tab="safe" class="vtab">Vault</button>
</nav>
<div id="sheet" aria-hidden="true"></div>
<script src="scene.js"></script>
<script src="qr.js"></script>
<script src="jsqr.js"></script>
<script src="bip39.js"></script>
<script src="demo.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
